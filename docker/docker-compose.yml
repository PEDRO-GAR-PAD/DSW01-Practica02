services:
  postgres:
    image: postgres:16
    container_name: dsw01-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dsw01_practica02
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dsw01_practica02"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: dsw01-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/dsw01_practica02
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      APP_BASIC_USER: admin
      APP_BASIC_PASSWORD: admin123
    ports:
      - "${APP_HOST_PORT:-8080}:8080"

volumes:
  postgres_data:
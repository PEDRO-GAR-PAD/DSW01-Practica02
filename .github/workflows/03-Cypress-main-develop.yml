name: 03-Cypress-main-develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_run:
    workflows:
      - "02-Sonar-main-develop"
    types:
      - completed

jobs:
  cypress:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest

    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Detect Cypress specs
        id: cypress-specs
        run: |
          if [ -d "frontend/cypress/e2e" ]; then
            specs_count=$(find frontend/cypress/e2e -type f \( -name "*.cy.ts" -o -name "*.cy.js" -o -name "*.cy.tsx" -o -name "*.cy.jsx" \) | wc -l)
          else
            specs_count=0
          fi

          if [ "$specs_count" -gt 0 ]; then
            echo "has_specs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_specs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Cypress
        if: steps.cypress-specs.outputs.has_specs == 'true'
        working-directory: frontend
        run: npm install --no-save cypress start-server-and-test

      - name: Run Cypress
        if: steps.cypress-specs.outputs.has_specs == 'true'
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          start: npm run start -- --host 0.0.0.0 --port 4200
          wait-on: 'http://127.0.0.1:4200'
          command: npx cypress run --e2e --spec "cypress/e2e/**/*.cy.{js,ts,jsx,tsx}"

      - name: Cypress skipped notice
        if: steps.cypress-specs.outputs.has_specs != 'true'
        run: echo "No Cypress specs found."

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots/
          retention-days: 5

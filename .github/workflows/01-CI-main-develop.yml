name: 01-CI-main-develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests (Backend + Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend unit tests
        run: mvn -B test --no-transfer-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Detect Angular unit test specs
        id: unit-specs
        run: |
          specs_count=$(find frontend/src -type f -name "*.spec.ts" | wc -l)
          if [ "$specs_count" -gt 0 ]; then
            echo "has_specs=true" >> "$GITHUB_OUTPUT"
            echo "Found $specs_count Angular spec file(s)."
          else
            echo "has_specs=false" >> "$GITHUB_OUTPUT"
            echo "No Angular spec files found. Frontend unit tests will be skipped without failing CI."
          fi

      - name: Run frontend unit tests (headless)
        if: steps.unit-specs.outputs.has_specs == 'true'
        working-directory: frontend
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Frontend unit tests skipped notice
        if: steps.unit-specs.outputs.has_specs != 'true'
        run: echo "Angular unit tests skipped because no *.spec.ts files were found in frontend/src."
